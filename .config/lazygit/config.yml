#
# Link to lazygit configuration file documentation
# https://github.com/jesseduffield/lazygit/blob/master/docs/Config.md
#

gui:
  sidePanelWidth: 0.35 # gives you more space to show things side-by-side

  theme:
    activeBorderColor:
      - "#ff966c"
      - "bold"
    inactiveBorderColor:
      - "#589ed7"
      # - "#82AAFF"
    searchingActiveBorderColor:
      - "#ff966c"
      - "bold"
    optionsTextColor:
      - "#82aaff"
    selectedLineBgColor:
      - "#2d3f76"
    cherryPickedCommitFgColor:
      - "#82aaff"
    cherryPickedCommitBgColor:
      - "#c099ff"
    markedBaseCommitFgColor:
      - "#82aaff"
    markedBaseCommitBgColor:
      - "#ffc777"
    unstagedChangesColor:
      - "#c53b53"
    defaultFgColor:
      - "#c8d3f5"
  # theme:
  #   activeBorderColor:
  #     # - "#C3E88D" # green
  #     # - "#82AAFF" # blue
  #     - "#ff966c" # orange
  #     - bold
  #   selectedLineBgColor:
  #     # - "#ff966c" # orange
  #     - "#2E3F76" # blue
  #     # - "#556CA4" # darker blue
  #     # - "#2F334D" # grey
  #     # - "#8268AE" # purple
  # #  authorColors:
  # #    "*": white
  scrollHeight: 20
  nerdFontsVersion: "3"
  tabWidth: 2
  commitHashLength: 3
  enlargedSideViewLocation: top
  expandFocusedSidePanel: false

  # If true, add a "/" root item in the file tree representing the root of the repository. It is only added when necessary, i.e. when there is more than one item at top level.
  showRootItemInFileTree: false

  # Whether to show the divergence from the base branch in the branches view.
  # One of: 'none' | 'onlyArrow'  | 'arrowAndNumber'
  showDivergenceFromBaseBranch: arrowAndNumber

  # How things are filtered when typing '/'.
  # One of 'substring' (default) | 'fuzzy'
  filterMode: fuzzy

  # If true, show the number of lines changed per file in the Files view
  # showNumstatInFilesView: true

# If true, display a confirmation when subprocess terminates. This allows you to
# view the output of the subprocess before returning to Lazygit.
promptToReturnFromSubprocess: false

git:
  paging:
    colorArg: always

    # Side by side diff
    # For global settings see ~/.gitconfig
    # Flags show line numbers and remove the left side line numbers since it is duplicated
    pager: delta --dark --paging=never
    # pager: 'delta --dark --paging=never --line-numbers --line-numbers-left-format="" --line-numbers-right-format="{np:>4} "'
    # pager: delta --dark --paging=never

    # Use gitconfig
    # useConfig: true

  # If true, lazygit will automatically stage files that used to have merge
  # conflicts but no longer do; and it will also ask you if you want to
  # continue a merge or rebase if you've resolved all conflicts. If false, it
  # won't do either of these things.
  autoStageResolvedConflicts: false

  # If true, parse emoji strings in commit messages e.g. render :rocket: as 🚀
  # (This should really be under 'gui', not 'git')
  parseEmoji: true

  log:
    # One of: 'date-order' | 'author-date-order' | 'topo-order' | 'default'
    # 'topo-order' makes it easier to read the git log graph, but commits may not
    # appear chronologically. See https://git-scm.com/docs/
    #
    # Can be changed from within Lazygit with `Log menu -> Commit sort order` (`<c-l>` in the commits window by default).
    order: date-order

  # If true, periodically fetch from remote
  autoFetch: false

  # If true, periodically refresh files and submodules
  autoRefresh: false

keybinding:
  universal:
    nextItem: "n"
    prevItem: "e"
    edit: "E"
    new: "N"
    scrollUpMain-alt1: <c-b>
    scrollDownMain-alt1: <c-f>
    filteringMenu: "J" # <c-f> is already used for page down
    scrollRight: I
    prevPage: <c-u>
    nextPage: <c-d>
    undo: u
    redo: <c-r>
  files:
    findBaseCommitForFixup: J # <c-f> is already used for page down
    openStatusFilter: K # <c-b> is already used for page down
    stashAllChanges: S # usually s
    viewStashOptions: s # usually S

os:
  # Reuse an existing nvim instance in tmux instead of spawning a new editor.
  # How it works:
  #   1. `tmux list-panes -s` lists all panes in the current session (-s = session-wide).
  #   2. Grep for a pane whose current command matches "vim" or "nvim".
  #   3. If found, switch to that pane's window and send `:e <file>` keystrokes to open the file.
  #   4. If no nvim pane exists, fall back to launching a new nvim process in-place.
  # This avoids hardcoding a window index so it works regardless of where lazygit,
  # Claude Code, or nvim are positioned across tmux windows/panes.
  # Also jumps to the first changed hunk by parsing `git diff` for the first @@ line number.
  # Checks unstaged diff first, then staged (--cached), so it works for both states.
  edit: 'sh -c ''HUNK=$(git diff -U0 -- "{{filename}}" 2>/dev/null | grep -m1 "^@@" | sed "s/.*+\([0-9]*\).*/\1/"); if [ -z "$HUNK" ]; then HUNK=$(git diff --cached -U0 -- "{{filename}}" 2>/dev/null | grep -m1 "^@@" | sed "s/.*+\([0-9]*\).*/\1/"); fi; MATCH=$(tmux list-panes -s -F "#{window_id} #{pane_id} #{pane_current_command}" | grep -E "n?vim" | head -n1); if [ -n "$MATCH" ]; then WIN=$(echo "$MATCH" | cut -d" " -f1); PANE=$(echo "$MATCH" | cut -d" " -f2); tmux select-window -t "$WIN" && tmux select-pane -t "$PANE" && tmux send-keys -t "$PANE" Escape ":e {{filename}}" Enter; if [ -n "$HUNK" ]; then tmux send-keys -t "$PANE" ":$HUNK" Enter; fi; else if [ -n "$HUNK" ]; then nvim "+$HUNK" "{{filename}}"; else nvim "{{filename}}"; fi; fi'''
  # editAtLine: same as edit but also sends `:<line>` to jump to the target line.
  # Fallback launches nvim with `+<line>` flag instead.
  editAtLine: 'sh -c ''MATCH=$(tmux list-panes -s -F "#{window_id} #{pane_id} #{pane_current_command}" | grep -E "n?vim" | head -n1); if [ -n "$MATCH" ]; then WIN=$(echo "$MATCH" | cut -d" " -f1); PANE=$(echo "$MATCH" | cut -d" " -f2); tmux select-window -t "$WIN" && tmux select-pane -t "$PANE" && tmux send-keys -t "$PANE" Escape ":e {{filename}}" Enter ":{{line}}" Enter; else nvim "+{{line}}" "{{filename}}"; fi'''
