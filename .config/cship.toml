# cship — Claude Code statusline
# Full config reference: https://cship.dev
[cship]
lines = [
  "$directory$git_branch$git_status$python$nodejs$rust",
  "$cship.model $cship.cost $cship.usage_limits",
  "$cship.context_bar"
]

[cship.model]
symbol = "󰚩  "
style  = "italic fg:#7aa2f7"

[cship.context_bar]
symbol             = " "
width              = 10
style              = "italic fg:#7aa2f7"
warn_threshold     = 60.0
warn_style         = "fg:#e0af68"
critical_threshold = 90.0
critical_style     = "bold fg:#f7768e"
format             = "[$symbol $value]($style)"

[cship.cost]
symbol             = "💰 "
style              = "italic fg:#a9b1d6"
warn_threshold     = 2.0
warn_style         = "italic fg:#e0af68"
critical_threshold = 5.0
critical_style     = "italic bold fg:#f7768e"

[cship.usage_limits]
five_hour_format   = "⌛ 5h {pct}% ({reset})"
seven_day_format   = "📅 7d {pct}% ({reset})"
separator          = " "
style              = "italic fg:#a9b1d6"
warn_threshold     = 60.0
warn_style         = "italic fg:#e0af68"
critical_threshold = 80.0
critical_style     = "italic bold fg:#f7768e"
