# vim: ft=sh
##############################################################################
# Kitty Configuration
#
# See below link for documentation of configuration options.
# https://sw.kovidgoyal.net/kitty/conf/
#
##############################################################################

##############################################################################
# Font
##############################################################################
# font_family      JetBrainsMono Nerd Font
font_size 15.0
modify_font cell_height 120% # line height

font_family Maple Mono NF
bold_font Maple Mono NF Bold
italic_font Maple Mono NF Italic
bold_italic_font Maple Mono NF BoldItalic

# font_family Maple Mono
# bold_font Maple Mono Bold
# italic_font Maple Mono Italic
# bold_italic_font Maple Mono Bold Italic

##############################################################################
# Cursor
##############################################################################
cursor_shape block
cursor_blink_interval 0
cursor_stop_blinking_after 0

cursor_trail 1
cursor_trail_decay 0.001 0.3

##############################################################################
# Window
##############################################################################
hide_window_decorations yes
macos_titlebar_color dark
remember_window_size yes
draw_minimal_borders yes

# set transparency, 1 is opaque, 0 is transparent
background_opacity 0.60
background_blur 15

# Dim text of other windows, value < 1 will be dimmed
inactive_text_alpha 1

##############################################################################
# Tab
##############################################################################
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style angled

##############################################################################
# Advanced
##############################################################################
notify_on_cmd_finish always

##############################################################################
# Keyboard / Keybindings
##############################################################################

# Link to documentation
# https://sw.kovidgoyal.net/kitty/conf/#keyboard-shortcuts

# Treat macOS Option key as Alt for terminal applications
macos_option_as_alt yes

clear_all_shortcuts yes # remove all default mappings
# kitty_mod ctrl+alt+shift # set keymap `kitty_mod` to `ctrl+alt+shift

# Clipboard
map cmd+c copy_to_clipboard
map cmd+v paste_from_clipboard

# Scrolling
# Slow down mouse wheel scrollback in kitty; tmux may still handle wheel events when mouse mode is enabled.
wheel_scroll_multiplier 2.0
map cmd+up scroll_line_up
map cmd+down scroll_line_down
map cmd+page_up scroll_page_up
map cmd+page_down scroll_page_down
map cmd+home scroll_home
map cmd+end scroll_end

# Windows
map cmd+n new_os_window

# Tabs
map cmd+w close_tab
map cmd+1 goto_tab 1
map cmd+2 goto_tab 2
map cmd+3 goto_tab 3
map cmd+4 goto_tab 4
map cmd+5 goto_tab 5
map cmd+6 goto_tab 6
map cmd+7 goto_tab 7

# Zoom
map cmd+plus change_font_size all +1
map cmd+minus change_font_size all -1

# Misc
map cmd+h hide_macos_app
map cmd+m minimize_macos_window
map cmd+q quit

##############################################################################
# Theme
##############################################################################
# include ./theme-catppuccin.conf
# include ./theme-gruvbox-dark.conf
include ./theme-tokyonight-moon.conf

##############################################################################
# Others
##############################################################################
copy_on_select clipboard
open_url_with default

# Open URL on plain left click (kitty's default left-click handler also handles
# selection/prompt, but we declare it explicitly here so it survives any future
# mouse-action overrides and works without cmd modifier on macOS).
mouse_map left click ungrabbed mouse_handle_click selection link prompt
mouse_map cmd+left click ungrabbed mouse_handle_click selection link prompt
