#!/usr/bin/env bash
## COLORSCHEME: gruvbox dark (medium)
set-option -g status "on"

# default statusbar color
# set-option -g status-style bg=colour235,fg=colour223 # bg=bg1, fg=fg1
# transparent background
set-option -g status-style bg=default,fg=colour223 # bg=bg1, fg=fg1

# mode style (vi copy mode highlighting)
set -g mode-style "fg=colour214,bg=colour239"

# default window title colors
set-window-option -g window-status-style bg=colour214,fg=colour235 # bg=yellow, fg=bg1

# default window with an activity alert
set-window-option -g window-status-activity-style bg=colour235,fg=colour248 # bg=bg1, fg=fg3

# active window title colors
set-window-option -g window-status-current-style bg=red,fg=colour235 # fg=bg1

# pane border
set-option -g pane-active-border-style fg=colour250 #fg2
set-option -g pane-border-style fg=colour235        #bg1

# message infos
set-option -g message-style bg=colour239,fg=colour223 # bg=bg2, fg=fg1

# writing commands inactive
set-option -g message-command-style bg=colour239,fg=colour223 # bg=fg3, fg=bg1

# pane number display
set-option -g display-panes-active-colour colour250 #fg2
set-option -g display-panes-colour colour235        #bg1

# clock
set-window-option -g clock-mode-colour colour109 #blue

# bell
set-window-option -g window-status-bell-style bg=colour167,fg=colour235 # bg=red, fg=bg

# Tmux Undercurl
set -g default-terminal "${TERM}"
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'  # undercurl support
set -as terminal-overrides ',*:Setulc=\E[58::2::::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'  # underscore colours - needs tmux-3.0

# tmux-plugins/tmux-prefix-highlight support
set -g @prefix_highlight_output_prefix "#[fg=colour214]#[bg=colour235]#[fg=colour235]#[bg=colour214]"
set -g @prefix_highlight_output_suffix ""

## Theme settings mixed with colors (unfortunately, but there is no cleaner way)
set-option -g status-justify "left"
set-option -g status-left-style none
set-option -g status-left-length "100"
set-option -g status-right-style none
set-option -g status-right-length "100"
set-window-option -g window-status-separator ""

# Left status bar
set-option -g status-left "#[bg=colour235,fg=colour241,nobold,noitalics,nounderscore]"
set-window-option -g window-status-current-format "#[bg=colour244,fg=colour235,nobold,noitalics,nounderscore]#[bg=colour244,fg=colour233] #I #[bg=colour244,fg=colour233,bold] #W#{?window_zoomed_flag,*Z,} #[bg=colour235,fg=colour244,nobold,noitalics,nounderscore]"
set-window-option -g window-status-format "#[bg=colour239,fg=colour235,noitalics]#[bg=colour239,fg=colour246] #I  #W #[bg=colour235,fg=colour239,noitalics]"

# Right status bar
set-option -g status-right "#[bg=colour235,fg=colour239 nobold, nounderscore, noitalics]#[bg=colour239,fg=colour246] #(~/.config/tmux/scripts/cpu.sh)#[fg=colour246]  #(~/.config/tmux/scripts/mem.sh)#[fg=colour246]  #(~/.config/tmux/scripts/battery.sh)#[fg=colour246]  %I:%M %p  󰘬 #(~/.config/tmux/scripts/git-branch.sh #{pane_current_path}) #[bg=colour239,fg=colour244,nobold,noitalics,nounderscore]#[bg=colour244,fg=colour233,nobold,noitalics,nounderscore] #(~/.config/tmux/scripts/format-session.sh #{session_name}) "
