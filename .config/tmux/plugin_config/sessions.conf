# vim:ft=sh

# Session picker (prefix + t).
# All UI / source-list logic lives in scripts/sessions/picker.sh so we can
# iterate on it without re-sourcing tmux. tmux_close_float is invoked
# inline so any currently-open float popup is dismissed before the picker
# takes over the screen.
unbind t
bind-key t run-shell "tmux_close_float; ~/.config/tmux/scripts/sessions/picker.sh"
