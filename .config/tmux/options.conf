# Keep the status bar at the bottom so pane content starts at the top.
set -g status-position top

# Allow for mouse support. e.g resizing panes
set -g mouse on

# Pass pane focus changes through so applications such as Neovim can react when hidden.
set -g focus-events on

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

set -g detach-on-destroy off # don't exit from tmux when closing a session

# Allow for longer time before prefix key is required for repeating keymaps (window resize)
set -g repeat-time 1000 # default = 500

# Keep pane scrollback useful without letting long-running sessions retain
# excessive grid history in memory or stress copy-mode cloning on macOS.
set -g history-limit 10000

# When deleting windows and tabs, reindex
set-option -g renumber-windows on

# Allow Kitty transparency/blur to pass through tmux
set -g allow-passthrough on

# Show each pane's foreground command, but identify Pi's Node process by its title.
# Heavy-line glyphs make pane separators more visible than single-line borders.
set -g pane-border-lines heavy
setw -g pane-border-status top
# Pi runs as a `node` process but sets the terminal title to "π - <name>".
# Detect that title so the pane border shows π and the window tab shows "pi".
# The tmux-sidebar pane would otherwise label itself "python3.12"; render no
# border text for it so the sidebar stays visually chrome-free.
set -g pane-border-format "#{?#{==:#{pane_title},tmux-sidebar},, #{?#{m:π*,#{pane_title}},π,#{pane_current_command}} }"
# automatic-rename drives the window tab text; default is just pane_current_command.
set -g automatic-rename-format "#{?#{m:π*,#{pane_title}},pi,#{?pane_in_mode,[tmux],#{pane_current_command}}#{?pane_dead,[dead],}}"

# Pass through modified Enter (Shift/Ctrl/Alt+Enter) and other extended keys
# so apps like Claude Code can distinguish them from plain Enter.
set -g extended-keys on
# Use CSI u encoding because Pi handles modified keys better with this format.
set -g extended-keys-format csi-u
# set -as terminal-features 'xterm*:extkeys'

# Set cursor color
# set -g cursor-colour "#e68660" # Pastel orange/pink
set -g cursor-colour "#e68660"
