# vim:ft=sh

# Clear 🔔 from the selected window when the user interacts.
# Pane/window/session hooks cover acknowledging Pi notifications at any tmux
# focus level. These use dedup+append (not `set-hook -g` replace) so they are
# reload-safe (no duplicate entries accumulate on re-source).
run-shell "~/.config/tmux/bin/tmux-dedup-hook after-select-pane clear-bell.sh"
set-hook -ag after-select-pane 'run-shell "~/.config/tmux/scripts/clear-bell.sh \"#{window_id}\" \"#{pane_id}\""'
run-shell "~/.config/tmux/bin/tmux-dedup-hook after-select-window clear-bell.sh"
set-hook -ag after-select-window 'run-shell "~/.config/tmux/scripts/clear-bell.sh \"#{window_id}\" \"#{pane_id}\""'
run-shell "~/.config/tmux/bin/tmux-dedup-hook client-session-changed clear-bell.sh"
set-hook -ag client-session-changed 'run-shell "~/.config/tmux/scripts/clear-bell.sh \"#{window_id}\" \"#{pane_id}\""'

# ---------------------------------------------------------------------------
# tmux-sidebar: persistent per-window session-list pane
# ---------------------------------------------------------------------------
# sidebar-ensure.sh idempotently spawns a `tmux-sidebar` pane in the current
# window (width from @tmux_sidebar_width, seeded from
# ~/.config/tmux-sidebar/config.json). Firing on new-window / select-window /
# client-session-changed / client-attached covers windows created before tmux
# started, fresh client attachments, and dead sidebar processes. Session
# changes also focus the pane immediately right of the sidebar.
# sidebar-repair.sh re-asserts the locked width after pane drags, terminal
# resizes, layout changes, and window/session/client changes; it only touches
# mismatched sidebar panes, so it cannot resize-loop.
run-shell "~/.config/tmux/bin/tmux-dedup-hook after-new-window sidebar-ensure.sh"
set-hook -ag after-new-window 'run-shell "~/.config/tmux/scripts/sidebar-ensure.sh \"#{window_id}\""'
run-shell "~/.config/tmux/bin/tmux-dedup-hook after-select-window sidebar-ensure.sh"
set-hook -ag after-select-window 'run-shell "~/.config/tmux/scripts/sidebar-ensure.sh \"#{window_id}\""'
run-shell "~/.config/tmux/bin/tmux-dedup-hook client-session-changed sidebar-ensure.sh"
set-hook -ag client-session-changed 'run-shell "~/.config/tmux/scripts/sidebar-ensure.sh \"#{window_id}\" --focus-content"'
run-shell "~/.config/tmux/bin/tmux-dedup-hook client-attached sidebar-ensure.sh"
set-hook -ag client-attached 'run-shell "~/.config/tmux/scripts/sidebar-ensure.sh \"#{window_id}\""'
# A sidebar width change updates the global authority immediately, but panes in
# other windows keep their old tmux dimensions until a resize event occurs.
# Re-run the repair when changing windows, sessions, or attached clients so the
# selected sidebar (and any other stale sidebar) is corrected without a manual
# pane resize.
run-shell "~/.config/tmux/bin/tmux-dedup-hook after-select-window sidebar-repair.sh"
set-hook -ag after-select-window 'run-shell "~/.config/tmux/scripts/sidebar-repair.sh"'
run-shell "~/.config/tmux/bin/tmux-dedup-hook client-session-changed sidebar-repair.sh"
set-hook -ag client-session-changed 'run-shell "~/.config/tmux/scripts/sidebar-repair.sh"'
run-shell "~/.config/tmux/bin/tmux-dedup-hook client-attached sidebar-repair.sh"
set-hook -ag client-attached 'run-shell "~/.config/tmux/scripts/sidebar-repair.sh"'
# Native tmux zoom resets when its pane exits. Restore the saved layout for
# sidebar-aware zoom before the remaining pane layout is repaired.
run-shell "~/.config/tmux/bin/tmux-dedup-hook pane-exited tmux-unzoom-on-pane-exit.sh"
set-hook -ag pane-exited 'run-shell "~/.config/tmux/scripts/tmux-unzoom-on-pane-exit.sh \"#{window_id}\""'

# Close a window whose only live pane is the sidebar. Killing the last
# non-sidebar pane (prefix+x or a shell exit) would otherwise leave a ghost
# window showing just the sidebar; this turns that into "just close the
# pane/window". Counting live panes only keeps the check correct whether the
# hook fires before (after-kill-pane) or after (pane-exited) the pane is removed.
run-shell "~/.config/tmux/bin/tmux-dedup-hook after-kill-pane sidebar-cleanup.sh"
set-hook -ag after-kill-pane 'run-shell "~/.config/tmux/scripts/sidebar-cleanup.sh"'
run-shell "~/.config/tmux/bin/tmux-dedup-hook pane-exited sidebar-cleanup.sh"
set-hook -ag pane-exited 'run-shell "~/.config/tmux/scripts/sidebar-cleanup.sh"'
# Closing a pane reflows the layout and can shift the sidebar's width, so
# re-assert the locked width on the same events. The repair script's debounce
# lock keeps its own resize-pane from fanning out, and it only touches
# mismatched sidebar panes, so it cannot resize-loop.
run-shell "~/.config/tmux/bin/tmux-dedup-hook after-kill-pane sidebar-repair.sh"
set-hook -ag after-kill-pane 'run-shell "~/.config/tmux/scripts/sidebar-repair.sh"'
run-shell "~/.config/tmux/bin/tmux-dedup-hook pane-exited sidebar-repair.sh"
set-hook -ag pane-exited 'run-shell "~/.config/tmux/scripts/sidebar-repair.sh"'

run-shell "~/.config/tmux/bin/tmux-dedup-hook after-resize-pane sidebar-repair.sh"
set-hook -ag after-resize-pane 'run-shell "~/.config/tmux/scripts/sidebar-repair.sh"'
run-shell "~/.config/tmux/bin/tmux-dedup-hook after-resize-window sidebar-repair.sh"
set-hook -ag after-resize-window 'run-shell "~/.config/tmux/scripts/sidebar-repair.sh"'
run-shell "~/.config/tmux/bin/tmux-dedup-hook client-resized sidebar-repair.sh"
set-hook -ag client-resized 'run-shell "~/.config/tmux/scripts/sidebar-repair.sh"'
# Catch layout mutations that do not come from resize-pane/resize-window, such
# as select-layout, splits, and pane moves, plus effective window size changes.
run-shell "~/.config/tmux/bin/tmux-dedup-hook --window window-layout-changed sidebar-repair.sh"
set-hook -agw window-layout-changed 'run-shell "~/.config/tmux/scripts/sidebar-repair.sh"'
run-shell "~/.config/tmux/bin/tmux-dedup-hook --window window-resized sidebar-repair.sh"
set-hook -agw window-resized 'run-shell "~/.config/tmux/scripts/sidebar-repair.sh"'

# Auto-setup nvim/lazygit windows for git-repo sessions.
# set-hook -g session-created 'run-shell "tmux_git_setup \"#{session_name}\" \"#{pane_current_path}\""'

# ---------------------------------------------------------------------------
# Persistent session-list lifecycle
# ---------------------------------------------------------------------------
# Hooks keep ~/.local/state/tmux/sessions.list in sync with the live tmux
# state so the session picker (prefix + t) can show / lazy-recreate sessions
# across tmux restarts without auto-restoring anything on startup.
#
# Reload-safety: a bare `-ag` append accumulates a duplicate entry every time
# hooks.conf is re-sourced. So each of our hooks below is preceded by
# `tmux-dedup-hook` (removes our prior entries by marker), then re-appended
# with `-ag`. Result: exactly one entry per event, reload-safe.
# ---------------------------------------------------------------------------

# Bump the saved list on session creation (save.sh skips *float* sessions).
# Passes --from-session so save.sh resolves the cwd from the NEW session's
# own `#{session_path}` (the `-c` dir) rather than `#{pane_current_path}`.
# In a session-created hook for a detached `new-session -d` issued from
# another client, `#{pane_current_path}` resolves to the TRIGGERING
# client's pane, not the new session's - which corrupts the saved cwd
# (e.g. picking `dot-files` from the `ml-scribe` client recorded ml-scribe's
# path against `dot-files`, so the next pick opened dot-files in ml-scribe).
# `#{hook_session_name}` is the newly-created session (not the triggering
# client's session), matching how the session-closed hook below identifies
# its target.
run-shell "~/.config/tmux/bin/tmux-dedup-hook session-created sessions/save.sh"
set-hook -ag session-created 'run-shell "~/.config/tmux/scripts/sessions/save.sh \"#{hook_session_name}\" --from-session"'

# Drop the entry on session close. remove.sh has a kill-server guard so a
# full `tmux kill-server` does NOT wipe the saved list — only single-session
# kills do.
set-hook -g session-closed 'run-shell "~/.config/tmux/scripts/sessions/remove.sh \"#{hook_session_name}\""'

# Keep the saved name in sync on session rename when tmux exposes distinct
# old/new names to hooks. tmux 3.6b expands both formats to the new name, so
# prefix+$ routes through rename.sh before renaming while the old name is known.
set-hook -g session-renamed 'run-shell "~/.config/tmux/scripts/sessions/rename.sh \"#{hook_session_name}\" \"#{session_name}\" \"#{pane_current_path}\""'
