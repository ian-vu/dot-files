# vim:ft=sh

# Clear 🔔 from the selected window when the user interacts.
# Pane/window/session hooks cover acknowledging Pi notifications at any tmux focus level.
set-hook -g after-select-pane 'run-shell "~/.config/tmux/scripts/clear-bell.sh"'
set-hook -g after-select-window 'run-shell "~/.config/tmux/scripts/clear-bell.sh"'
set-hook -g client-session-changed 'run-shell "~/.config/tmux/scripts/clear-bell.sh"'

# ---------------------------------------------------------------------------
# tmux-sidebar: persistent per-window session-list pane
# ---------------------------------------------------------------------------
# sidebar-ensure.sh idempotently spawns a `tmux-sidebar` pane in the current
# window (width from @tmux_sidebar_width, seeded from
# ~/.config/tmux-sidebar/config.json). Firing on new-window / select-window /
# client-session-changed covers windows created before tmux started and
# respawns the pane if the sidebar process died. sidebar-repair.sh re-asserts
# the locked width after pane drags and terminal resizes; it only touches
# mismatched sidebar panes, so it cannot resize-loop. tmux-dedup-hook removes
# our prior entries by marker before each `-ag` append so re-sourcing this
# file stays reload-safe (no duplicate hook entries accumulate).
run-shell "~/.config/tmux/bin/tmux-dedup-hook after-new-window sidebar-ensure.sh"
set-hook -ag after-new-window 'run-shell "~/.config/tmux/scripts/sidebar-ensure.sh \"#{window_id}\""'
run-shell "~/.config/tmux/bin/tmux-dedup-hook after-select-window sidebar-ensure.sh"
set-hook -ag after-select-window 'run-shell "~/.config/tmux/scripts/sidebar-ensure.sh \"#{window_id}\""'
run-shell "~/.config/tmux/bin/tmux-dedup-hook client-session-changed sidebar-ensure.sh"
set-hook -ag client-session-changed 'run-shell "~/.config/tmux/scripts/sidebar-ensure.sh \"#{window_id}\""'
# Close a window whose only live pane is the sidebar. Killing the last
# non-sidebar pane (prefix+x or a shell exit) would otherwise leave a ghost
# window showing just the sidebar; this turns that into "just close the
# pane/window". Counting live panes only keeps the check correct whether the
# hook fires before (after-kill-pane) or after (pane-exited) the pane is removed.
run-shell "~/.config/tmux/bin/tmux-dedup-hook after-kill-pane sidebar-cleanup.sh"
set-hook -ag after-kill-pane 'run-shell "~/.config/tmux/scripts/sidebar-cleanup.sh"'
run-shell "~/.config/tmux/bin/tmux-dedup-hook pane-exited sidebar-cleanup.sh"
set-hook -ag pane-exited 'run-shell "~/.config/tmux/scripts/sidebar-cleanup.sh"'
run-shell "~/.config/tmux/bin/tmux-dedup-hook after-resize-pane sidebar-repair.sh"
set-hook -ag after-resize-pane 'run-shell "~/.config/tmux/scripts/sidebar-repair.sh"'
run-shell "~/.config/tmux/bin/tmux-dedup-hook after-resize-window sidebar-repair.sh"
set-hook -ag after-resize-window 'run-shell "~/.config/tmux/scripts/sidebar-repair.sh"'
run-shell "~/.config/tmux/bin/tmux-dedup-hook client-resized sidebar-repair.sh"
set-hook -ag client-resized 'run-shell "~/.config/tmux/scripts/sidebar-repair.sh"'

# Auto-setup nvim/lazygit windows for git-repo sessions.
set-hook -g session-created 'run-shell "tmux_git_setup \"#{session_name}\" \"#{pane_current_path}\""'

# ---------------------------------------------------------------------------
# Persistent session-list lifecycle
# ---------------------------------------------------------------------------
# Three hooks keep ~/.local/state/tmux/sessions.list in sync with the live
# tmux state so the session picker (prefix + t) can show / lazy-recreate
# sessions across tmux restarts without auto-restoring anything on startup.
#
# `-ag` on session-created APPENDS to the hook above instead of overwriting
# it, so tmux_git_setup keeps running. Without `-a` this line would
# silently disable the git-repo window setup.
# ---------------------------------------------------------------------------

# Bump the saved list on session creation (save.sh skips *float* sessions).
set-hook -ag session-created 'run-shell "~/.config/tmux/scripts/sessions/save.sh \"#{session_name}\" \"#{pane_current_path}\""'

# Drop the entry on session close. remove.sh has a kill-server guard so a
# full `tmux kill-server` does NOT wipe the saved list — only single-session
# kills do.
set-hook -g session-closed 'run-shell "~/.config/tmux/scripts/sessions/remove.sh \"#{hook_session_name}\""'

# Keep the saved name in sync on session rename.
# `#{hook_session_name}` is the OLD (pre-rename) name; `#{session_name}` is the NEW.
set-hook -g session-renamed 'run-shell "~/.config/tmux/scripts/sessions/rename.sh \"#{hook_session_name}\" \"#{session_name}\" \"#{pane_current_path}\""'
