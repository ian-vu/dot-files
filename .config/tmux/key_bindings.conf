# vim:ft=conf

# ============================================================================
# PREFIX CONFIGURATION
# ============================================================================

unbind C-Space
set -g prefix C-Space
bind C-Space send-prefix

# ============================================================================
# GENERAL SETTINGS
# ============================================================================

# Use default clipboard when in copy mode
set-option -g set-clipboard on

# Reload tmux configuration
unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"

# ============================================================================
# WINDOW MANAGEMENT
# ============================================================================

# Create new window
bind-key n new-window -c "#{pane_current_path}"

# Switch to last window
unbind-key b
bind-key b last-window

# Kill the current window while landing on the previous numeric index instead of
# tmux's most-recent window. A single-window session keeps default kill behavior.
unbind-key &
# -r lets prefix-& be held/repeated to close successive windows. Each repeat
# runs previous-window first, which re-points ! (last window) at the window just
# left, so kill-window -t ! removes that one and lands on the next numeric index.
bind-key -r & if -F '#{==:#{session_windows},1}' 'kill-window' 'previous-window; kill-window -t !'

# Kill every other window in the current session, keeping the focused window.
unbind-key X
bind-key X confirm-before -p "kill all other windows in #S? (y/n)" \
  'kill-window -a -t "#{session_id}:#{window_index}"'

# Move/swap windows (-d to prevent detaching, -r for repeatable)
bind-key -r Left swap-window -d -t -1
bind-key -r Right swap-window -d -t +1

# Remap switch to window numbers (commented out)
# bind-key n select-window -t :1
# bind-key -n M-n select-window -t :1
# bind-key e select-window -t :2
# bind-key -n M-e select-window -t :2
# bind-key i select-window -t :3

# Open currently history in nvim, use temporary file to avoid overwriting
bind-key E run-shell 'f=$(mktemp /tmp/tmux_scrollback.XXXXXX); tmux capture-pane -pS - > "$f"; tmux new-window -n "scrollback" "nvim $f"'

# ============================================================================
# PANE MANAGEMENT
# ============================================================================

# Split panes
unbind s
# split right
bind-key v split-window -h -l "50%" -c "#{pane_current_path}"
# split left
bind-key V split-window -h -b -l "50%" -c "#{pane_current_path}"
# split down
bind-key s split-window -v -l "50%" -c "#{pane_current_path}"
# split up
bind-key S split-window -v -b -l "50%" -c "#{pane_current_path}"

# Kill panes without prompting. If the pane is the last one in the window,
# land on the previous numeric window before removing the now-empty window.
bind-key -r x if -F '#{==:#{window_panes},1}' \
  'if -F "#{==:#{session_windows},1}" "kill-pane" "previous-window; kill-window -t !"' \
  'kill-pane'
bind-key -r q if -F '#{==:#{window_panes},1}' \
  'if -F "#{==:#{session_windows},1}" "kill-pane" "previous-window; kill-window -t !"' \
  'kill-pane'

# Swap panes
bind-key S-Left swap-pane -U
bind-key S-Down swap-pane -D

# Rotate pane positions (swap left/right column groups), focus follows pane
bind-key Space run-shell 'tmux rotate-window -D && tmux select-pane -t "#{pane_id}"'

# Move the focused pane into a side column, similar to moving a Neovim split.
# If a pane already exists on that side, stack this pane below it instead of
# creating another nested column. The logic lives in scripts so tmux formats are
# evaluated at each step instead of all at bind-time.
bind-key H run-shell "$HOME/.config/tmux/bin/tmux_move_pane_left '#{pane_id}'"
bind-key L run-shell "$HOME/.config/tmux/bin/tmux_move_pane_right '#{pane_id}'"

# Resize panes
# Use resize-pane instead of select-layout so mixed/nested layouts are preserved.
bind-key -r -T prefix + resize-pane -U 3
bind-key -r -T prefix - resize-pane -D 3
bind-key -r -T prefix < resize-pane -L 10
bind-key -r -T prefix > resize-pane -R 10
# Keep tmux-sidebar visible while enlarging the focused pane.
bind-key z run-shell "$HOME/.config/tmux/bin/tmux_zoom_sidebar '#{pane_id}'"
bind-key _ run-shell "$HOME/.config/tmux/bin/tmux_resize_balance vertical"
bind-key | run-shell "$HOME/.config/tmux/bin/tmux_resize_balance horizontal"

# k: clear scrollback history only (keep visible screen).
bind-key k clear-history \; display-message "Cleared history"

# K: clear visible screen + scrollback history.
# Writes ANSI clear/home directly to the pane TTY so it works even when the
# running program (TUI, nvim, etc.) doesn't bind ^L to clear-screen.
bind-key K run-shell "printf '\\033[H\\033[2J' > #{pane_tty}" \; clear-history \; display-message "Cleared screen and history"

# ============================================================================
# PANE NAVIGATION (Vim-Tmux-Navigator with Colemak)
# ============================================================================

# Smart pane switching with awareness of Vim splits
# See: https://github.com/christoomey/vim-tmux-navigator
vim_pattern='(\S+/)?g?\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?'
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +${vim_pattern}$'"

# Colemak navigation: h=left, n=down, e=up, i=right. Smart pane switching with
# awareness of Vim splits (see https://github.com/christoomey/vim-tmux-navigator).
# Restore a sidebar-aware zoom layout before switching tmux panes.
bind-key -n 'M-h' if-shell "$is_vim" 'send-keys M-h' 'run-shell "$HOME/.config/tmux/bin/tmux_navigate_unzoom L"'
bind-key -n 'M-n' if-shell "$is_vim" 'send-keys M-n' 'run-shell "$HOME/.config/tmux/bin/tmux_navigate_unzoom D"'
bind-key -n 'M-e' if-shell "$is_vim" 'send-keys M-e' 'run-shell "$HOME/.config/tmux/bin/tmux_navigate_unzoom U"'
bind-key -n 'M-i' if-shell "$is_vim" 'send-keys M-i' 'run-shell "$HOME/.config/tmux/bin/tmux_navigate_unzoom R"'

# Handle last pane (M-\) based on tmux version
tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'
if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
  "bind-key -n 'M-\\' if-shell \"$is_vim\" 'send-keys M-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
  "bind-key -n 'M-\\' if-shell \"$is_vim\" 'send-keys M-\\\\'  'select-pane -l'"

# Copy mode navigation (Colemak)
bind-key -T copy-mode-vi 'M-h' select-pane -L
bind-key -T copy-mode-vi 'M-n' select-pane -D
bind-key -T copy-mode-vi 'M-e' select-pane -U
bind-key -T copy-mode-vi 'M-i' select-pane -R
bind-key -T copy-mode-vi 'M-\' select-pane -l

# Unbind tab to prevent conflicts with M-i
unbind -n tab

# ============================================================================
# COPY MODE (Colemak navigation)
# ============================================================================

# Enter copy mode and immediately start a backward (upward) search, replacing
# tmux's default prefix-/ key-binding lookup prompt.
bind-key / copy-mode \; send-keys "?"

# Unbind default vim navigation keys
unbind -T copy-mode-vi h
unbind -T copy-mode-vi j
unbind -T copy-mode-vi k
unbind -T copy-mode-vi l

# Cursor movement (Colemak: h=left, n=down, e=up, i=right)
bind -T copy-mode-vi h send-keys -X cursor-left
bind -T copy-mode-vi n send-keys -X cursor-down
bind -T copy-mode-vi e send-keys -X cursor-up
bind -T copy-mode-vi i send-keys -X cursor-right

# Selection and copying
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe "pbcopy"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"

# Mouse wheel: 1 line per notch in copy mode (tmux default is 5)
bind -T copy-mode-vi WheelUpPane   select-pane \; send-keys -X -N 1 scroll-up
bind -T copy-mode-vi WheelDownPane select-pane \; send-keys -X -N 1 scroll-down
bind -T copy-mode    WheelUpPane   select-pane \; send-keys -X -N 1 scroll-up
bind -T copy-mode    WheelDownPane select-pane \; send-keys -X -N 1 scroll-down

# Search navigation
bind -T copy-mode-vi j send-keys -X search-again
bind -T copy-mode-vi J send-keys -X search-reverse

# Exit copy mode on Escape. The default binds Escape to clear-selection, which
# leaves you stuck in copy mode after dismissing a search prompt (prefix-/ sends
# "?" to open the upward search prompt; Esc cancels the prompt but not copy mode).
# Rebinding to cancel makes Esc return to normal mode.
bind -T copy-mode-vi Escape send-keys -X cancel

# Open current selection in nvim in a new window
# Bail when the selection is empty so we don't spawn nvim on a blank buffer.
bind -T copy-mode-vi E send-keys -X copy-pipe-and-cancel 'f=$(mktemp /tmp/tmux_selection.XXXXXX); cat > "$f"; if [ -s "$f" ]; then tmux new-window -n "selection" "nvim $f"; else rm -f "$f"; fi'

# Open the URL at the current copy-mode match (like gx in Neovim), then return
# to the live pane. prefix+g x enters at the bottom and finds the newest URL.
bind -T copy-mode-vi g switch-client -T copy-mode-vi-g
bind -T copy-mode-vi-g x run-shell "$HOME/.config/tmux/bin/tmux_open_url #{pane_id}"

# ============================================================================
# SESSION MANAGEMENT
# ============================================================================

# Keep prefix+f unassigned so tmux does not intercept it for a floating session.
unbind-key f

# Rename via the session-state wrapper so the saved picker entry changes with
# the live tmux session. The tmux rename hook does not expose the old name on
# tmux 3.6b, so a plain rename-session would leave stale saved entries behind.
unbind-key $
bind-key $ command-prompt -I "#S" -p "rename-session:" \
  'run-shell "~/.config/tmux/scripts/sessions/rename.sh \"#{session_name}\" \"%%\" \"#{pane_current_path}\" --rename-session"'

# Switch to last session.
bind-key l switch-client -l

# C-_ (same as C-/) bindings
# NOTE: C-_ is the same as C-/
unbind C-_
unbind C-/
bind-key -n C-_ send-keys ""
bind-key -n C-/ send-keys ""

# ============================================================================
# EXTERNAL SCRIPTS
# ============================================================================

# Toggle the tmux-sidebar session-list pane in the current window. The script
# also flips @tmux_sidebar_enabled so ensure hooks keep it off once toggled off.
bind-key B run-shell "$HOME/.config/tmux/scripts/sidebar-toggle.sh"

# Git worktree picker popup. Opens the floating fzf UI immediately; type a
# branch/PR URL there, or prefix it with a session name, to create a worktree.
bind-key w run-shell "$HOME/.config/tmux/bin/worktree/tmux_worktree --pane-path #{q:pane_current_path}"

# Group git actions behind prefix+g: g opens LazyGit, while x searches upward
# from the bottom for the newest http URL, opens it, and exits copy mode.
bind-key g switch-client -T prefix-g
bind-key -T prefix-g g display-popup -b rounded -S fg=white -T '#[align=centre] LazyGit ' \
  -d "#{session_path}" -E -w 95% -h 90% "LAZYGIT_IN_POPUP=1 lazygit"
bind-key -T prefix-g x copy-mode \; send-keys -X history-bottom \; \
  send-keys -X search-backward -- "http" \; \
  run-shell "$HOME/.config/tmux/bin/tmux_open_url #{pane_id}"

# Open Neovim directly into Diffview in the same throwaway popup shape as LazyGit.
bind-key G display-popup -b rounded -S fg=white -T '#[align=centre] Diffview ' \
  -d "#{session_path}" -E -w 95% -h 90% "nvim -c 'DiffviewOpen'"

