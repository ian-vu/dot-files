# vim:ft=conf

# ============================================================================
# PREFIX CONFIGURATION
# ============================================================================

unbind C-Space
set -g prefix C-Space
bind C-Space send-prefix

# ============================================================================
# GENERAL SETTINGS
# ============================================================================

# Use default clipboard when in copy mode
set-option -g set-clipboard on

# Copy mode cursor color
set-window-option -g mode-style "fg=black,bg=orange"

# Reload tmux configuration
unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"

# ============================================================================
# WINDOW MANAGEMENT
# ============================================================================

# Create new window
bind-key n new-window -c "#{pane_current_path}"

# Switch to last window
unbind-key b
bind-key b last-window

# Move/swap windows (-d to prevent detaching, -r for repeatable)
bind-key -r Left swap-window -d -t -1
bind-key -r Right swap-window -d -t +1

# Remap switch to window numbers (commented out)
# bind-key n select-window -t :1
# bind-key -n M-n select-window -t :1
# bind-key e select-window -t :2
# bind-key -n M-e select-window -t :2
# bind-key i select-window -t :3

# Open currently history in nvim, use temporary file to avoid overwriting
bind-key E run-shell 'f=$(mktemp /tmp/tmux_scrollback.XXXXXX); tmux capture-pane -pS - > "$f"; tmux new-window -n "scrollback" "nvim $f"'

# ============================================================================
# PANE MANAGEMENT
# ============================================================================

# Split panes
unbind s
# split right
bind-key v split-window -h -l "45%" -c "#{pane_current_path}"
# split left
bind-key V split-window -h -b -l "45%" -c "#{pane_current_path}"
# split down
bind-key s split-window -v -l "40%" -c "#{pane_current_path}"
# split up
bind-key S split-window -v -b -l "40%" -c "#{pane_current_path}"

# Kill pane (skip "kill-pane 1? (y/n)" prompt, -r for repeatable)
bind-key -r x kill-pane
bind-key -r q kill-pane

# Swap panes
bind-key S-Left swap-pane -U
bind-key S-Down swap-pane -D

# Rotate pane positions (swap left/right column groups), focus follows pane
bind-key Space run-shell 'tmux rotate-window -D && tmux select-pane -t "#{pane_id}"'

# Resize panes
bind-key -r -T prefix + resize-pane -U 2
bind-key -r -T prefix _ resize-pane -D 2
bind-key -r -T prefix < resize-pane -L 10
bind-key -r -T prefix > resize-pane -R 10

# Equalize pane splits, 50%
bind-key - select-layout even-vertical
bind-key | select-layout even-horizontal

# k: clear scrollback history only (keep visible screen).
bind-key k clear-history \; display-message "Cleared history"

# K: clear visible screen + scrollback history.
# Writes ANSI clear/home directly to the pane TTY so it works even when the
# running program (TUI, nvim, etc.) doesn't bind ^L to clear-screen.
bind-key K run-shell "printf '\\033[H\\033[2J' > #{pane_tty}" \; clear-history \; display-message "Cleared screen and history"

# ============================================================================
# PANE NAVIGATION (Vim-Tmux-Navigator with Colemak)
# ============================================================================

# Smart pane switching with awareness of Vim splits
# See: https://github.com/christoomey/vim-tmux-navigator
vim_pattern='(\S+/)?g?\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?'
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +${vim_pattern}$'"

# Colemak navigation: h=left, n=down, e=up, i=right
bind-key -n 'M-h' if-shell "$is_vim" 'send-keys M-h' 'select-pane -L'
bind-key -n 'M-n' if-shell "$is_vim" 'send-keys M-n' 'select-pane -D'
bind-key -n 'M-e' if-shell "$is_vim" 'send-keys M-e' 'select-pane -U'
bind-key -n 'M-i' if-shell "$is_vim" 'send-keys M-i' 'select-pane -R'

# Handle last pane (M-\) based on tmux version
tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'
if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
  "bind-key -n 'M-\\' if-shell \"$is_vim\" 'send-keys M-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
  "bind-key -n 'M-\\' if-shell \"$is_vim\" 'send-keys M-\\\\'  'select-pane -l'"

# Copy mode navigation (Colemak)
bind-key -T copy-mode-vi 'M-h' select-pane -L
bind-key -T copy-mode-vi 'M-n' select-pane -D
bind-key -T copy-mode-vi 'M-e' select-pane -U
bind-key -T copy-mode-vi 'M-i' select-pane -R
bind-key -T copy-mode-vi 'M-\' select-pane -l

# Unbind tab to prevent conflicts with M-i
unbind -n tab

# ============================================================================
# COPY MODE (Colemak navigation)
# ============================================================================

# Unbind default vim navigation keys
unbind -T copy-mode-vi h
unbind -T copy-mode-vi j
unbind -T copy-mode-vi k
unbind -T copy-mode-vi l

# Cursor movement (Colemak: h=left, n=down, e=up, i=right)
bind -T copy-mode-vi h send-keys -X cursor-left
bind -T copy-mode-vi n send-keys -X cursor-down
bind -T copy-mode-vi e send-keys -X cursor-up
bind -T copy-mode-vi i send-keys -X cursor-right

# Selection and copying
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe "pbcopy"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"

# Search navigation
bind -T copy-mode-vi j send-keys -X search-again
bind -T copy-mode-vi J send-keys -X search-reverse

# Open current selection in nvim in a new window
# Bail when the selection is empty so we don't spawn nvim on a blank buffer.
bind -T copy-mode-vi E send-keys -X copy-pipe-and-cancel 'f=$(mktemp /tmp/tmux_selection.XXXXXX); cat > "$f"; if [ -s "$f" ]; then tmux new-window -n "selection" "nvim $f"; else rm -f "$f"; fi'

# Open URL under/nearest cursor (like gx in neovim)
bind -T copy-mode-vi g switch-client -T copy-mode-vi-g
bind -T copy-mode-vi-g x run-shell "tmux_open_url #{pane_id}"

# ============================================================================
# SESSION MANAGEMENT
# ============================================================================

# Floating session (script found in bin)
bind-key f run-shell "tmux_float"

# Switch to last session.
bind-key l switch-client -l

# C-_ (same as C-/) bindings
# NOTE: C-_ is the same as C-/
unbind C-_
unbind C-/
bind-key -n C-_ send-keys ""
bind-key -n C-/ send-keys ""

# ============================================================================
# EXTERNAL SCRIPTS
# ============================================================================

# Git worktree picker (branch → worktree + session)
bind-key w run-shell "$HOME/.config/tmux/bin/worktree/tmux_worktree"

# Toggle AI agent
bind-key a run-shell "tmux_ai"
